[package]
name = "tuneflow-source-runtime-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-support = []

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rquickjs = "=0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"
