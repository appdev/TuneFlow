name: Release integrated clients

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      android: ${{ steps.metadata.outputs.android }}
      service: ${{ steps.metadata.outputs.service }}
    steps:
      - uses: actions/checkout@v6
      - id: metadata
        name: Validate frozen release inputs
        env:
          EXPECTED_REPOSITORY: appdev/Q-music
        run: |
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./package.json')
          const android = require('./publish/mobile-version.json')
          const service = require('./publish/service-version.json')
          if (process.env.GITHUB_REF !== 'refs/tags/v' + pkg.version) throw Error('Dispatch from the matching version tag')
          if (android.version !== pkg.version || service.repository !== 'appdev/TuneFlow') throw Error('Mismatched release sources')
          if (![android.commit, service.commit].every(sha => /^[a-f0-9]{40}$/.test(sha))) throw Error('Pin complete source commits')
          const notes = fs.readFileSync('publish/release-' + pkg.version + '.md', 'utf8')
          if (!notes.includes('<!-- qmusic-service-preview -->') || notes.length < 80) throw Error('Missing preview release notes')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + pkg.version + '\nandroid=' + android.commit + '\nservice=' + service.commit + '\n')
          NODE

  verify:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test test/releaseBundle.test.cjs

  desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: darwin-arm64 }
          - { runner: macos-latest, target: darwin-x64 }
          - { runner: windows-latest, target: win32-x64 }
          - { runner: windows-latest, target: win32-arm64 }
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-latest, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      Q_PREVIEW_OUTPUT_ROOT: artifacts/release
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack:service -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: qmusic-release-${{ matrix.target }}
          path: |
            artifacts/release/${{ matrix.target }}/*.zip
            artifacts/release/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error

  web:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: appdev/TuneFlow
          ref: ${{ needs.metadata.outputs.service }}
          path: service
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: service
      - name: Build Web with compatibility entry
        working-directory: service
        run: npm run build:web:qmusic -- "$GITHUB_WORKSPACE"
      - name: Archive Web
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: tar -czf "Q-music-Web-$VERSION.tar.gz" -C service/dist/web-qmusic .
      - uses: actions/upload-artifact@v6
        with:
          name: qmusic-release-web
          path: Q-music-Web-*.tar.gz
          if-no-files-found: error

  android:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.android }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - run: npm ci
      - name: Verify shared functionality
        run: |
          npm run test:update
          npm run test:accounts
          npm run test:account-transfer
          npm run test:qq-sync
          npm run test:browse
          npm run test:downloads
          npm run test:download-selection
          npm run test:playback-preferences
          npm run test:background
      - run: npm run pack:android:standalone
      - name: Verify preview identity and APK signatures
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for apk in android/app/build/outputs/apk/standalone/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > /tmp/qmusic-apk-badging.txt
            grep -q "name='io.github.nshpiter.qmusic.mobile.preview'" /tmp/qmusic-apk-badging.txt
            grep -q "versionName='$VERSION-preview'" /tmp/qmusic-apk-badging.txt
          done
      - uses: actions/upload-artifact@v6
        with:
          name: qmusic-release-android
          path: android/app/build/outputs/apk/standalone/*.apk
          if-no-files-found: error

  publish:
    needs: [metadata, verify, desktop, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: qmusic-release-*
          path: release-assets
          merge-multiple: true
      - name: Validate complete bundle and record checksums
        run: node scripts/prepare-release.cjs release-assets
      - name: Publish complete preview release
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --verify-tag --draft --prerelease --title "Q-music $VERSION 整合预览版" --notes-file "publish/release-$VERSION.md"
          fi
          gh release edit "$tag" --draft=false --prerelease --latest=false
