# Opt-in static frontend override; use with compose.yaml after local acceptance.
services:
  tuneflow-web:
    environment:
      TUNEFLOW_WEB_ROOT: /app/dist/web-qmusic
    volumes:
      - type: bind
        source: ${Q_MUSIC_WEB_ROOT:-./dist/web-qmusic}
        target: /app/dist/web-qmusic
        read_only: true
        bind:
          create_host_path: false
