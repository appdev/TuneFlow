name: Docker build

on:
  pull_request:
    branches: [main, dev]
    paths: ['apps/service/**', 'Dockerfile', '.dockerignore', '.github/workflows/docker-build.yml']
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the verified image; false only builds and checks health
        type: boolean
        default: false
      publish_release:
        description: Publish a GitHub release after image health and storage checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tuneflow-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CONTAINER: tuneflow-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_IMAGE: tuneflow-server-web:ci
      CI_CONFIG_VOLUME: tuneflow-ci-config-${{ github.run_id }}-${{ github.run_attempt }}
      CI_MUSIC_VOLUME: tuneflow-ci-music-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release tag
        if: inputs.publish_release
        shell: bash
        run: |
          version="$(node -p "require('./apps/service/package.json').version")"
          test "$GITHUB_REF" = "refs/tags/v$version"
          test -s "apps/service/docs/releases/$version.md"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.CI_IMAGE }}

      - name: Start container
        run: |
          docker volume create "$CI_CONFIG_VOLUME"
          docker volume create "$CI_MUSIC_VOLUME"
          docker run --detach \
            --name "$CI_CONTAINER" \
            --volume "$CI_CONFIG_VOLUME:/config" \
            --volume "$CI_MUSIC_VOLUME:/music" \
            "$CI_IMAGE"

      - name: Wait for healthy container
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$CI_CONTAINER")"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' "$CI_CONTAINER")" == exited ]]; then
              docker logs "$CI_CONTAINER"
              exit 1
            fi
            sleep 2
          done
          docker logs "$CI_CONTAINER"
          exit 1

      - name: Verify storage ownership
        run: |
          docker exec "$CI_CONTAINER" test -f /config/database/tuneflow.data.db
          docker exec "$CI_CONTAINER" test -f /config/storage-layout.json
          docker exec "$CI_CONTAINER" test ! -e /music/tuneflow.data.db
          docker exec "$CI_CONTAINER" test ! -e /music/sources

      - name: Log in to Docker Hub
        if: inputs.push_image || inputs.publish_release
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: inputs.push_image || inputs.publish_release
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          image="$DOCKERHUB_USERNAME/tuneflow-server"
          version="$(node -p "require('./apps/service/package.json').version")"
          sha_tag="sha-${GITHUB_SHA::12}"
          docker tag "$CI_IMAGE" "$image:latest"
          docker tag "$CI_IMAGE" "$image:$version"
          docker tag "$CI_IMAGE" "$image:$sha_tag"
          docker push "$image:latest"
          docker push "$image:$version"
          docker push "$image:$sha_tag"

      - name: Print container logs on failure
        if: failure()
        run: docker logs "$CI_CONTAINER" || true

      - name: Clean up container resources
        if: always()
        run: |
          docker rm --force --volumes "$CI_CONTAINER" || true
          docker volume rm "$CI_CONFIG_VOLUME" || true
          docker volume rm "$CI_MUSIC_VOLUME" || true

  publish-release:
    if: inputs.publish_release
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Record published image and publish release
        shell: bash
        run: |
          version="$(node -p "require('./apps/service/package.json').version")"
          image="$DOCKERHUB_USERNAME/tuneflow-server:$version"
          export RELEASE_IMAGE="$image"
          export RELEASE_DIGEST="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          node <<'NODE'
          const fs = require('node:fs')
          const version = require('./apps/service/package.json').version
          const digest = process.env.RELEASE_DIGEST
          if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw Error('Missing published image digest')
          fs.writeFileSync('release-manifest.json', JSON.stringify({
            version, commit: process.env.GITHUB_SHA, image: process.env.RELEASE_IMAGE,
            digest, platform: 'linux/amd64',
          }, null, 2) + '\n')
          NODE
          tag="v$version"
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" release-manifest.json --clobber
          else
            gh release create "$tag" release-manifest.json --verify-tag --draft --title "TuneFlow $version" --notes-file "apps/service/docs/releases/$version.md"
          fi
          gh release edit "$tag" --draft=false --latest
