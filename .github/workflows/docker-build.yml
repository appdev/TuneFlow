name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CONTAINER: lx-music-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_IMAGE: lx-music-server-web:ci
      CI_VOLUME: lx-music-ci-data-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.CI_IMAGE }}

      - name: Start container
        run: |
          docker volume create "$CI_VOLUME"
          docker run --detach \
            --name "$CI_CONTAINER" \
            --volume "$CI_VOLUME:/data" \
            "$CI_IMAGE"

      - name: Wait for healthy container
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$CI_CONTAINER")"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' "$CI_CONTAINER")" == exited ]]; then
              docker logs "$CI_CONTAINER"
              exit 1
            fi
            sleep 2
          done
          docker logs "$CI_CONTAINER"
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs "$CI_CONTAINER" || true

      - name: Clean up container resources
        if: always()
        run: |
          docker rm --force --volumes "$CI_CONTAINER" || true
          docker volume rm "$CI_VOLUME" || true
