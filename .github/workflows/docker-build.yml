name: Docker build

on:
  pull_request:
    branches: [main, dev]
    paths: ['apps/service/**', 'apps/player/**', 'packages/**', 'Dockerfile', '.dockerignore', '.github/workflows/docker-build.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source to build; publication uses the unified release workflow
        type: string
        required: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      export_image:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tuneflow-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CONTAINER: tuneflow-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_IMAGE: tuneflow-server-web:ci
      CI_CONFIG_VOLUME: tuneflow-ci-config-${{ github.run_id }}-${{ github.run_attempt }}
      CI_MUSIC_VOLUME: tuneflow-ci-music-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve image source
        id: source
        run: |
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./apps/service/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.CI_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.source }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}

      - name: Start container
        run: |
          docker volume create "$CI_CONFIG_VOLUME"
          docker volume create "$CI_MUSIC_VOLUME"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          export TUNEFLOW_ACCESS_PASSWORD="$password"
          docker run --detach \
            --name "$CI_CONTAINER" \
            --env TUNEFLOW_ACCESS_PASSWORD \
            --volume "$CI_CONFIG_VOLUME:/config" \
            --volume "$CI_MUSIC_VOLUME:/music" \
            "$CI_IMAGE"

      - name: Wait for healthy container
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$CI_CONTAINER")"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' "$CI_CONTAINER")" == exited ]]; then
              docker logs "$CI_CONTAINER"
              exit 1
            fi
            sleep 2
          done
          docker logs "$CI_CONTAINER"
          exit 1

      - name: Verify storage ownership
        run: |
          docker exec "$CI_CONTAINER" test -f /config/database/tuneflow.data.db
          docker exec "$CI_CONTAINER" test -f /config/storage-layout.json
          docker exec "$CI_CONTAINER" test ! -e /music/tuneflow.data.db
          docker exec "$CI_CONTAINER" test ! -e /music/sources

      - name: Verify first password setup and change
        run: docker exec --interactive "$CI_CONTAINER" node - before < scripts/verify-docker-access.cjs

      - name: Verify changed password survives restart
        run: |
          docker restart "$CI_CONTAINER"
          docker exec --interactive "$CI_CONTAINER" node - after < scripts/verify-docker-access.cjs

      - name: Export verified image for unified publication
        if: inputs.export_image
        shell: bash
        run: docker save "$CI_IMAGE" | gzip > tuneflow-image.tar.gz

      - uses: actions/upload-artifact@v6
        if: inputs.export_image
        with:
          name: tuneflow-verified-image
          path: tuneflow-image.tar.gz
          if-no-files-found: error

      - name: Print container logs on failure
        if: failure()
        run: docker logs "$CI_CONTAINER" || true

      - name: Clean up container resources
        if: always()
        run: |
          docker rm --force --volumes "$CI_CONTAINER" || true
          docker volume rm "$CI_CONFIG_VOLUME" || true
          docker volume rm "$CI_MUSIC_VOLUME" || true
