name: Recover tested Docker publication

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact original tested image source SHA
        type: string
        required: true
      version:
        description: Original matching TuneFlow tag version
        type: string
        required: true
      artifact_run_id:
        description: Failed Docker-only release run with successful image tests
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: tuneflow-unified-release
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE: ${{ inputs.source_ref }}
      RELEASE_VERSION: ${{ inputs.version }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test publication identity and recovery gates
        run: node --test test/unified-release.test.cjs test/docker-recovery.test.cjs
      - name: Verify original tag, source and successful image build
        run: node scripts/recover-docker-publication.cjs verify
      - name: Download the original verified image without rebuilding
        run: gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name tuneflow-verified-image --dir verified-image
      - name: Load the original tested image
        run: docker load --input verified-image/tuneflow-image.tar.gz
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Recheck image identity and complete publication
        run: node scripts/recover-docker-publication.cjs publish
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: docker-recovery-publication
          path: docker-publication.json
          if-no-files-found: ignore
