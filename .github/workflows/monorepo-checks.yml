name: Shared contracts and client checks
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monorepo-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: apps/service
      - run: npm ci
        working-directory: apps/player
      - run: npm ci
        working-directory: apps/android
      - run: npm test
      - run: npm run prepare:service
      - run: npm run test:contract
      - run: npm test
        working-directory: apps/player
      - run: npm run test:service
        working-directory: apps/android
